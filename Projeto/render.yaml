services:
  - type: web
    name: fluxo-api
    env: php
    rootDir: backend
    buildCommand: "./build.sh"
    startCommand: "heroku-php-apache2 public/"
    envVars:
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: fluxo-db
          property: connectionString

databases:
  - name: fluxo-db
    databaseName: fluxodb
    user: fluxouser
