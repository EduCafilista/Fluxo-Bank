<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fluxo - Banco Digital</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    h1 { color: #38bdf8; font-size: 28px; margin-bottom: 4px; }
    .sub { color: #94a3b8; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 14px; margin-bottom: 6px; color: #cbd5e1; }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #0f172a;
      color: #e2e8f0;
      font-size: 15px;
    }
    button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0ea5e9;
      color: #0f172a;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover { background: #38bdf8; }
    .status {
      margin-top: 20px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Fluxo</h1>
    <p class="sub">Banco digital - página inicial de teste</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" placeholder="••••••••" required>

      <button type="submit">Entrar</button>
    </form>

    <p class="status">Página estática de teste. Login ainda não conectado ao backend.</p>
  </main>

  <script>
    document.getElementById('form-login').addEventListener('submit', function (e) {
      e.preventDefault();
      alert('Login ainda não implementado. Em breve, conectado à API Laravel.');
    });
  </script>
