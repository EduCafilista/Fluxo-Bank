<text x="48" y="46" class="title">SEQ-09 — limites Pix e execução de agendamento</text>
<text x="48" y="78" class="subtitle">Reserva de limite por dia/janela, fallback sem chave e worker idempotente.</text><rect x="65" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/><text x="150" y="171" class="actor" text-anchor="middle">Cliente</text><line x1="150" y1="187" x2="150" y2="1000" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="370" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.7"/><text x="455" y="171" class="actor" text-anchor="middle">API / PixController</text><line x1="455" y1="187" x2="455" y2="1000" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="685" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.7"/><text x="770" y="171" class="actor" text-anchor="middle">MotorAntifraude</text><line x1="770" y1="187" x2="770" y2="1000" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1005" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.7"/><text x="1090" y="171" class="actor" text-anchor="middle">PostgreSQL</text><line x1="1090" y1="187" x2="1090" y2="1000" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1340" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7"/><text x="1425" y="171" class="actor" text-anchor="middle">Worker</text><line x1="1425" y1="187" x2="1425" y2="1000" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="150" y1="235" x2="455" y2="235" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="302.5" y="227" class="msg" text-anchor="middle">Pix + Idempotency-Key</text><rect x="449" y="225" width="12" height="55" rx="3" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="1"/><line x1="455" y1="315" x2="1090" y2="315" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="772.5" y="307" class="msg" text-anchor="middle">consulta chave/status + política</text><rect x="1084" y="305" width="12" height="120" rx="3" fill="#475569" stroke="#475569" stroke-width="1"/><line x1="455" y1="395" x2="770" y2="395" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="612.5" y="387" class="msg" text-anchor="middle">seleciona DIURNA/NOTURNA</text><rect x="764" y="385" width="12" height="165" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/><line x1="770" y1="475" x2="1090" y2="475" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="930.0" y="467" class="msg" text-anchor="middle">reserva consumo com lock</text><rect x="1084" y="455" width="12" height="125" rx="3" fill="#475569" stroke="#475569" stroke-width="1"/><rect x="690" y="510" width="660" height="170" rx="10" fill="#fefce8" stroke="#d97706" stroke-width="1.4"/><text x="710" y="536" class="entity">alt — conta sem chave Pix ativa</text><line x1="770" y1="570" x2="1090" y2="570" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/><text x="930.0" y="562" class="msg" text-anchor="middle">aplica limite_sem_chave_*</text><line x1="1090" y1="630" x2="770" y2="630" stroke="#dc2626" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-red)"/><text x="930.0" y="622" class="msg" text-anchor="middle">limite reduzido / zero → recusa</text><line x1="770" y1="705" x2="1090" y2="705" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="930.0" y="697" class="msg" text-anchor="middle">dentro do limite → reserva confirmada</text><rect x="300" y="735" width="1150" height="215" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/><text x="320" y="761" class="entity">agendamento futuro</text><line x1="455" y1="800" x2="1090" y2="800" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="772.5" y="792" class="msg" text-anchor="middle">INSERT agendamentos PENDENTE_VALIDACAO</text><line x1="455" y1="850" x2="1090" y2="850" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="772.5" y="842" class="msg" text-anchor="middle">UPDATE status = AGENDADO</text><line x1="1425" y1="900" x2="1090" y2="900" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1257.5" y="892" class="msg" text-anchor="middle">lock dos vencidos AGENDADO</text><rect x="1419" y="880" width="12" height="95" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><line x1="1425" y1="945" x2="1090" y2="945" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1257.5" y="937" class="msg" text-anchor="middle">EM_PROCESSAMENTO → transação idempotente</text><line x1="1090" y1="990" x2="770" y2="990" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="930.0" y="982" class="msg" text-anchor="middle">EXECUTADO / FALHOU + uso/liberação</text><line x1="770" y1="1035" x2="455" y2="1035" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="612.5" y="1027" class="msg" text-anchor="middle">resposta e comprovante</text><rect x="70" y="1025" width="520" height="60" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="82" y="1046" class="note">A reserva e o consumo ficam na mesma transação;</text><text x="82" y="1063" class="note">duas requisições não ultrapassam o limite.</text><rect x="1120" y="1025" width="470" height="60" rx="8" fill="#fffbeb" stroke="#7c3aed" stroke-width="1.3"/><text x="1132" y="1046" class="note">Status finais: EXECUTADO, FALHOU,</text><text x="1132" y="1063" class="note">CANCELADO ou EXPIRADO.</text></svg>