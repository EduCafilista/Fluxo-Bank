<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="syncArrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2c5282"/>
    </marker>
    <marker id="retArrow2" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a5568" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>
  <text x="450" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">SEQ-08 — Geração de QR Code para recebimento de Pix</text>

  <!-- Lifeline headers -->
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="34" width="100" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="80" y="50" font-weight="bold">Cliente</text>
    <text x="80" y="64" font-style="italic" font-size="9" fill="#4a5568">«ator»</text>

    <rect x="200" y="34" width="100" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="250" y="50" font-weight="bold">App/Web</text>
    <text x="250" y="64" font-style="italic" font-size="9" fill="#4a5568">«boundary»</text>

    <rect x="370" y="34" width="150" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="445" y="50" font-weight="bold">PagamentoController</text>
    <text x="445" y="64" font-style="italic" font-size="9" fill="#4a5568">«control»</text>

    <rect x="550" y="34" width="150" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="625" y="50" font-weight="bold">PagamentosService</text>

    <rect x="730" y="34" width="110" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="785" y="50" font-weight="bold">PostgreSQL</text>
    <text x="785" y="64" font-style="italic" font-size="9" fill="#4a5568">«database»</text>
  </g>

  <!-- Lifelines -->
  <g stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="80" y1="74" x2="80" y2="520"/>
    <line x1="250" y1="74" x2="250" y2="520"/>
    <line x1="445" y1="74" x2="445" y2="520"/>
    <line x1="625" y1="74" x2="625" y2="520"/>
    <line x1="785" y1="74" x2="785" y2="520"/>
  </g>

  <!-- Activation bars -->
  <g fill="#dbe9fa" stroke="#2c5282" stroke-width="1">
    <rect x="440" y="115" width="10" height="330"/>
    <rect x="620" y="150" width="10" height="270"/>
  </g>

  <g font-size="10.5" fill="#1a202c">
    <text x="90" y="107">gerarCobrancaPix(valor, descricao, validade)</text>
    <text x="260" y="137">POST /api/v1/pix/cobrancas</text>
    <text x="455" y="167">gerarQrCodePix(valor, descricao, validade)</text>
    <text x="635" y="197">montarPayloadEmv(chave, valor, id, recebedor)</text>
    <text x="635" y="222">— RN36 —</text>
    <text x="635" y="252">INSERT cobrancas (ABERTA, payload_emv)</text>
    <text x="635" y="282">gerarImagemQrCode(payload)</text>
    <text x="635" y="312">registrar(QRCODE_GERADO)</text>
    <text x="455" y="347">qrCode (imagem) + payload</text>
    <text x="260" y="382">200 OK — QR Code</text>
    <text x="90" y="417">QR Code exibido para leitura</text>
  </g>

  <g stroke="#2c5282" stroke-width="1.4" marker-end="url(#syncArrow2)">
    <line x1="80" y1="111" x2="250" y2="111"/>
    <line x1="250" y1="141" x2="445" y2="141"/>
    <line x1="445" y1="171" x2="625" y2="171"/>
    <line x1="625" y1="256" x2="785" y2="256"/>
  </g>
  <g stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#retArrow2)">
    <line x1="625" y1="351" x2="445" y2="351"/>
    <line x1="445" y1="386" x2="250" y2="386"/>
    <line x1="250" y1="421" x2="80" y2="421"/>
  </g>

  <!-- alt fragment (validation) -->
  <rect x="55" y="450" width="800" height="80" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M55,450 L140,450 L140,467 L125,467 L55,467 Z" fill="#f0f4f8" stroke="#718096" stroke-width="1"/>
  <text x="65" y="463" font-size="10.5" font-weight="bold" fill="#2c5282">alt</text>
  <text x="150" y="463" font-size="10.5" font-style="italic" fill="#4a5568">validação dos dados da cobrança</text>
  <text x="65" y="487" font-size="10" font-style="italic" fill="#4a5568">[valor &gt; 0 e dados completos] → QR Code gerado e exibido (fluxo acima)</text>
  <text x="65" y="505" font-size="10" font-style="italic" fill="#4a5568">[valor ausente ou negativo] → 422 Unprocessable Entity, nenhum registro criado</text>

  <text x="450" y="545" text-anchor="middle" font-size="10" fill="#718096">O pagamento do QR Code (por cliente Fluxo ou pagador externo) segue o núcleo contábil de SEQ-03.</text>
</svg>
