<svg viewBox="0 0 1040 740" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="syncArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#2c5282"/>
    </marker>
    <marker id="retArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a5568" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1040" height="740" fill="#ffffff"/>
  <text x="520" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">SEQ-07 — Assinatura: contratação e retirada de item</text>

  <!-- Lifeline headers -->
  <g font-size="11" text-anchor="middle">
    <rect x="30" y="34" width="100" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="80" y="50" font-weight="bold">Cliente</text>
    <text x="80" y="64" font-style="italic" font-size="9" fill="#4a5568">«ator»</text>

    <rect x="200" y="34" width="100" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="250" y="50" font-weight="bold">App/Web</text>
    <text x="250" y="64" font-style="italic" font-size="9" fill="#4a5568">«boundary»</text>

    <rect x="370" y="34" width="140" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="440" y="50" font-weight="bold">AssinaturaController</text>
    <text x="440" y="64" font-style="italic" font-size="9" fill="#4a5568">«control»</text>

    <rect x="540" y="34" width="140" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="610" y="50" font-weight="bold">AssinaturaService</text>

    <rect x="710" y="34" width="110" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="765" y="50" font-weight="bold">PostgreSQL</text>
    <text x="765" y="64" font-style="italic" font-size="9" fill="#4a5568">«database»</text>

    <rect x="860" y="34" width="110" height="40" rx="4" fill="#eaf2fb" stroke="#2c5282"/>
    <text x="915" y="50" font-weight="bold">Auditoria</text>
  </g>

  <!-- Lifelines (dashed) -->
  <g stroke="#a0aec0" stroke-width="1.2" stroke-dasharray="4,4">
    <line x1="80" y1="74" x2="80" y2="700"/>
    <line x1="250" y1="74" x2="250" y2="700"/>
    <line x1="440" y1="74" x2="440" y2="700"/>
    <line x1="610" y1="74" x2="610" y2="700"/>
    <line x1="765" y1="74" x2="765" y2="700"/>
    <line x1="915" y1="74" x2="915" y2="700"/>
  </g>

  <!-- Activation bars -->
  <g fill="#dbe9fa" stroke="#2c5282" stroke-width="1">
    <rect x="435" y="120" width="10" height="175"/>
    <rect x="605" y="155" width="10" height="115"/>
    <rect x="435" y="395" width="10" height="175"/>
    <rect x="605" y="425" width="10" height="105"/>
  </g>

  <!-- ===== Bloco 1: contratação ===== -->
  <g font-size="10.5" fill="#1a202c">
    <text x="90" y="92">contratar(plano)</text>
    <text x="260" y="122">POST /api/v1/assinaturas</text>
    <text x="450" y="152">contratar(cliente, plano)</text>
    <text x="620" y="182">INSERT assinatura (status=ATIVA) + cobrança inicial</text>
    <text x="620" y="212">registrar(ASS_CONTRATADA)</text>
    <text x="450" y="247">assinatura ATIVA</text>
    <text x="260" y="277">201 Created</text>
    <text x="90" y="307">confirmação exibida</text>
  </g>
  <g stroke="#2c5282" stroke-width="1.4" marker-end="url(#syncArrow)">
    <line x1="80" y1="96" x2="250" y2="96"/>
    <line x1="250" y1="126" x2="440" y2="126"/>
    <line x1="440" y1="156" x2="610" y2="156"/>
    <line x1="610" y1="186" x2="765" y2="186"/>
    <line x1="610" y1="216" x2="915" y2="216"/>
  </g>
  <g stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#retArrow)">
    <line x1="610" y1="251" x2="440" y2="251"/>
    <line x1="440" y1="281" x2="250" y2="281"/>
    <line x1="250" y1="311" x2="80" y2="311"/>
  </g>

  <!-- ===== alt fragment ===== -->
  <rect x="55" y="335" width="935" height="345" fill="none" stroke="#718096" stroke-width="1.2" stroke-dasharray="3,3"/>
  <path d="M55,335 L140,335 L140,352 L125,352 L55,352 Z" fill="#f0f4f8" stroke="#718096" stroke-width="1"/>
  <text x="65" y="348" font-size="10.5" font-weight="bold" fill="#2c5282">alt</text>
  <text x="150" y="348" font-size="10.5" font-style="italic" fill="#4a5568">retirar item da assinatura</text>

  <text x="65" y="372" font-size="10" font-style="italic" fill="#4a5568">[item ativo encontrado]</text>

  <g font-size="10.5" fill="#1a202c">
    <text x="90" y="392">removerItem(item, motivo)</text>
    <text x="260" y="422">DELETE /assinaturas/{id}/itens/{item}</text>
    <text x="450" y="452">removerItem(item, motivo)</text>
    <text x="620" y="482">UPDATE dataExclusao, motivoExclusao</text>
    <text x="620" y="497">+ recalcularValor() (RN22/RN23)</text>
    <text x="620" y="527">registrar(ITEM_RETIRADO)</text>
    <text x="450" y="557">item retirado, valorAtual atualizado</text>
    <text x="260" y="587">200 OK</text>
    <text x="90" y="617">fatura atualizada exibida</text>
  </g>
  <g stroke="#2c5282" stroke-width="1.4" marker-end="url(#syncArrow)">
    <line x1="80" y1="396" x2="250" y2="396"/>
    <line x1="250" y1="426" x2="440" y2="426"/>
    <line x1="440" y1="456" x2="610" y2="456"/>
    <line x1="610" y1="486" x2="765" y2="486"/>
    <line x1="610" y1="531" x2="915" y2="531"/>
  </g>
  <g stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#retArrow)">
    <line x1="610" y1="561" x2="440" y2="561"/>
    <line x1="440" y1="591" x2="250" y2="591"/>
    <line x1="250" y1="621" x2="80" y2="621"/>
  </g>

  <line x1="55" y1="640" x2="990" y2="640" stroke="#718096" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="65" y="655" font-size="10" font-style="italic" fill="#4a5568">[item não encontrado ou já retirado]</text>
  <g stroke="#4a5568" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#retArrow)">
    <line x1="440" y1="672" x2="250" y2="672"/>
  </g>
  <text x="260" y="668" font-size="10.5" fill="#1a202c">404 Not Found</text>

  <!-- footnote -->
  <text x="520" y="720" text-anchor="middle" font-size="10" fill="#718096">Toda retirada de item é append-only: nenhum DELETE físico ocorre em itens_assinatura.</text>
</svg>
