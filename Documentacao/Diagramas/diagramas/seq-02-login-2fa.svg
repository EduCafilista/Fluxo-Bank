<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="900px" version="1.1" viewBox="0 0 1250 900" width="1250px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430" /></marker><marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="100%" width="100%" x="0" y="0" /><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="14px" font-weight="700" text-anchor="middle" x="625" y="28">SEQ-02 — Autenticação com 2FA + Token Sanctum (RF17) — REVISADO v3.0</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="10px" text-anchor="middle" x="625" y="48">RF02 RF17 tokenAcesso 2FA condicional dois_fatores_ativo hash SHA-256 código uso único TTL 60min</text><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="20" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="80" y="88">Cliente</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="80" y="100">«ator»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="80" x2="80" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="200" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="260" y="88">App/Web</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="260" y="100">«boundary»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="260" x2="260" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="380" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="440" y="88">AuthController</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="440" y="100">«control»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="440" x2="440" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="560" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="620" y="88">AuthService</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="620" y="100">«objeto»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="620" x2="620" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="740" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="800" y="88">PostgreSQL</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="800" y="100">«database»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="800" x2="800" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="920" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="980" y="88">Servico2FA</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="980" y="100">«objeto»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="980" x2="980" y1="110" y2="850" /><rect fill="#e0f2fe" height="40" rx="6" stroke="#0284c7" width="120" x="1070" y="70" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="700" text-anchor="middle" x="1130" y="88">Auditoria</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="1130" y="100">«objeto»</text><line stroke="#94a3b8" stroke-dasharray="4,4" stroke-width="1" x1="1130" x2="1130" y1="110" y2="850" /><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="80" x2="260" y1="140" y2="140" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="170.0" y="134">informa e-mail e senha</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="260" x2="440" y1="160" y2="160" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="350.0" y="154">POST /api/v1/login RF17</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="440" x2="620" y1="180" y2="180" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="530.0" y="174">autenticar(email, senha) + emitirToken()</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="800" y1="200" y2="200" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="194">SELECT usuario WHERE email</text><line marker-end="url(#arrow)" stroke="#0f6f5c" stroke-dasharray="5,4" stroke-width="1.3" x1="800" x2="620" y1="220" y2="220" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="214">hash + dois_fatores_ativo + tokenAcesso</text><rect fill="none" height="80" stroke="#94a3b8" stroke-dasharray="4,3" width="400" x="250" y="260" /><text fill="#b91c1c" font-family="Segoe UI, Arial" font-size="8px" font-weight="700" x="260" y="272">alt [credenciais inválidas ou bloqueado 5 falhas 15min]</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="1130" y1="285" y2="285" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="875.0" y="279">registrar(LOGIN_FALHOU, ip, user-agent) RF-SEG04 ACESSO</text><line marker-end="url(#arrow)" stroke="#0f6f5c" stroke-dasharray="5,4" stroke-width="1.3" x1="620" x2="260" y1="300" y2="300" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="440.0" y="294">401 Unauthorized + tentativas_restantes</text><rect fill="none" height="160" stroke="#94a3b8" stroke-dasharray="4,3" width="750" x="250" y="335" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8px" font-weight="700" x="260" y="347">alt [credenciais válidas + dois_fatores_ativo=true] — 2FA condicional</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="800" y1="365" y2="365" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="359">INSERT codigos_verificacao hash SHA-256 expira_em finalidade=LOGIN</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="980" y1="375" y2="375" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="800.0" y="369">gerarCodigo(6 dígitos, TTL 3min) finalidade LOGIN</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="980" x2="800" y1="385" y2="385" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="890.0" y="379">INSERT (codigoHash, expiraEm, tentativas, utilizadoEm)</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="1130" y1="395" y2="395" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="875.0" y="389">registrar(LOGIN_2FA_DESAFIO) RF-SEG04</text><line marker-end="url(#arrow)" stroke="#0f6f5c" stroke-dasharray="5,4" stroke-width="1.3" x1="620" x2="260" y1="405" y2="405" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="440.0" y="399">200 {desafio_2fa, token_temporario}</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="80" x2="260" y1="425" y2="425" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="170.0" y="419">digita código recebido</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="260" x2="440" y1="440" y2="440" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="350.0" y="434">POST /api/v1/2fa/validar</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="440" x2="620" y1="455" y2="455" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="530.0" y="449">validarCodigo(token_temp, codigo) + emitirToken() RF17</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="800" y1="470" y2="470" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="464">SELECT código vigente não utilizado</text><rect fill="none" height="90" stroke="#94a3b8" stroke-dasharray="4,3" width="400" x="430" y="510" /><text fill="#0f6f5c" font-size="8px" font-weight="700" x="440" y="522">alt [código válido e não expirado e não reutilizado]</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="800" y1="535" y2="535" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="529">UPDATE codigo SET utilizado_em=now() uso único</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="800" y1="545" y2="545" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="710.0" y="539">INSERT personal_access_tokens Sanctum TTL 60min emitirToken()</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="1130" y1="555" y2="555" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="875.0" y="549">registrar(LOGIN_2FA_SUCESSO) + token hash encadeado</text><line marker-end="url(#arrow)" stroke="#0f6f5c" stroke-dasharray="5,4" stroke-width="1.3" x1="620" x2="260" y1="565" y2="565" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="440.0" y="559">200 {access_token Bearer RF17} + refresh_token</text><rect fill="none" height="50" stroke="#94a3b8" stroke-dasharray="4,3" width="400" x="430" y="580" /><text fill="#b91c1c" font-size="8px" font-weight="700" x="440" y="592">alt [código inválido/expirado/reutilizado]</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-dasharray="0" stroke-width="1.3" x1="620" x2="1130" y1="605" y2="605" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="875.0" y="599">registrar(2FA_FALHOU) RF-SEG04 ACESSO</text><line marker-end="url(#arrow)" stroke="#0f6f5c" stroke-dasharray="5,4" stroke-width="1.3" x1="620" x2="260" y1="615" y2="615" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="440.0" y="609">401 {erro: código inválido} 3 tentativas max</text></svg>