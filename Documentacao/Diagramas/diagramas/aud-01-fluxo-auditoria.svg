<line x1="165.0" y1="380.0" x2="1055.0" y2="380.0" stroke="#1b2430" stroke-width="1.6"/>
<line x1="165.0" y1="380.0" x2="165.0" y2="420.0" stroke="#1b2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<line x1="455.0" y1="380.0" x2="455.0" y2="420.0" stroke="#1b2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
