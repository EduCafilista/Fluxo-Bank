<line x1="342.0" y1="296.0" x2="878.0" y2="296.0" stroke="#b45309" stroke-width="0.9"/>
<text x="342.0" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">id, criado_em, ator_id, perfil, acao, entidade, entidade_id,</text>
<text x="342.0" y="326.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">dados_anteriores JSONB, dados_novos JSONB, ip INET, user_agent,</text>
<text x="342.0" y="341.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">hash_registro, hash_anterior - sem UPDATE e sem DELETE</text>
