<text x="962.0" y="162.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Job ProcessaAuditoria grava em</text>
<text x="962.0" y="176.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">logs_auditoria sem impactar</text>
<text x="962.0" y="191.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">a latencia da resposta</text>
