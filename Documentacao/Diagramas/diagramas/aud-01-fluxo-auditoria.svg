<line x1="52.0" y1="146.0" x2="258.0" y2="146.0" stroke="#0f6f5c" stroke-width="0.9"/>
<text x="52.0" y="162.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Login, transferencia, retirada,</text>
<text x="52.0" y="176.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">alteracao de limite, exclusao</text>
