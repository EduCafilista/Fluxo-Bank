<text x="1075.0" y="280.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#b3261e">Trigger de protecao</text>
<line x1="962.0" y1="296.0" x2="1188.0" y2="296.0" stroke="#b3261e" stroke-width="0.9"/>
<text x="962.0" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">BEFORE UPDATE OR DELETE</text>
<text x="962.0" y="326.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">FOR EACH ROW EXECUTE FUNCTION</text>
<text x="962.0" y="341.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">bloquear_alteracao_auditoria()</text>
<text x="962.0" y="355.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">RAISE EXCEPTION</text>
<line x1="950.0" y1="308.0" x2="890.0" y2="308.0" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow-ink)"/>
