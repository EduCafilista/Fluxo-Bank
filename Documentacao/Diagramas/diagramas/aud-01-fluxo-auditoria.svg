<line x1="1075.0" y1="380.0" x2="1075.0" y2="420.0" stroke="#1b2430" stroke-width="1.5" marker-end="url(#arrow-ink)"/>
<rect x="40.0" y="560.0" width="1160.0" height="92.0" rx="7" fill="#f6f6fb" stroke="#1b2430" stroke-width="1.5"/>
<text x="620.0" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#1b2430">Rastreabilidade</text>
<line x1="52.0" y1="596.0" x2="1188.0" y2="596.0" stroke="#1b2430" stroke-width="0.9"/>
<text x="52.0" y="612.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">RF45 (registrar), RF46 (imutabilidade), RF48 (consulta pelo auditor), RF53-RF58 (2FA), RF59-RF64</text>
<text x="52.0" y="624.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">(retirada), RF65-RF72 (assinatura)</text>
<text x="52.0" y="639.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">RN17 (todo acesso a dados de terceiros e auditado) - RNF13 (nenhum dado pessoal em log de aplicacao) -</text>
<text x="52.0" y="651.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">RNF14 (LGPD) - RNF19 (backup semanal)</text>
<text x="40.0" y="690.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="600" text-anchor="start" fill="#b3261e">Nenhum registro de auditoria pode ser alterado ou excluido: a correcao de um erro e feita por novo lancamento, nunca por edicao.</text>

