<text x="165.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#0f6f5c">5. Consulta do auditor</text>
<line x1="52.0" y1="456.0" x2="278.0" y2="456.0" stroke="#0f6f5c" stroke-width="0.9"/>
<text x="52.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Filtros por autor, periodo, acao</text>
<text x="52.0" y="486.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">e entidade; perfil somente</text>
<text x="52.0" y="501.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">leitura; exportacao CSV</text>
<rect x="330.0" y="420.0" width="250.0" height="92.0" rx="7" fill="#fdf3e7" stroke="#b45309" stroke-width="1.7"/>
<text x="455.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#b45309">6. Alerta de seguranca</text>
<line x1="342.0" y1="456.0" x2="568.0" y2="456.0" stroke="#b45309" stroke-width="0.9"/>
<text x="342.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Regras: 5 logins falhos, 2FA</text>
<text x="342.0" y="486.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">reprovado, retirada acima do</text>
<text x="342.0" y="501.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">teto, alteracao de limite</text>
<rect x="640.0" y="420.0" width="250.0" height="92.0" rx="7" fill="#e8f0f8" stroke="#1d4f91" stroke-width="1.7"/>
<text x="765.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#1d4f91">7. Evidencia para o cliente</text>
<line x1="652.0" y1="456.0" x2="878.0" y2="456.0" stroke="#1d4f91" stroke-width="0.9"/>
<text x="652.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Extrato de auditoria do proprio</text>
<text x="652.0" y="486.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">cliente: quem acessou, quando</text>
<text x="652.0" y="501.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">e de onde</text>
<rect x="950.0" y="420.0" width="250.0" height="92.0" rx="7" fill="#e8f0f8" stroke="#1d4f91" stroke-width="1.7"/>
<text x="1075.0" y="440.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.2" font-weight="700" text-anchor="middle" fill="#1d4f91">8. Retencao e LGPD</text>
<line x1="962.0" y1="456.0" x2="1188.0" y2="456.0" stroke="#1d4f91" stroke-width="0.9"/>
<text x="962.0" y="472.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">5 anos para operacoes financeiras;</text>
<text x="962.0" y="486.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">anonimizacao de dados pessoais;</text>
<text x="962.0" y="501.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">nada de senha ou codigo 2FA</text>
