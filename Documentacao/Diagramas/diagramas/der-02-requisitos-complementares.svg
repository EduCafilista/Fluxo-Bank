<text x="48" y="78" class="subtitle">Relacionamentos adicionados ao modelo físico; a tabela assinaturas_cartao é uma consulta separada da assinatura do Fluxo.</text><rect x="70" y="165" width="270" height="180" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="70" y="165" width="270" height="34" rx="10" fill="#2563eb"/><rect x="70" y="189" width="270" height="10" fill="#2563eb"/><text x="82" y="187" class="section">CONTAS</text><text x="82" y="219" class="field">id • cliente_id</text><text x="82" y="236" class="field">status / status_abertura</text><text x="82" y="253" class="field">sem coluna de saldo</text><rect x="400" y="165" width="280" height="180" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/><rect x="400" y="165" width="280" height="34" rx="10" fill="#0ea5e9"/><rect x="400" y="189" width="280" height="10" fill="#0ea5e9"/><text x="412" y="187" class="section">CARTOES</text><text x="412" y="219" class="field">id • conta_id</text><text x="412" y="236" class="field">modalidade • status</text><text x="412" y="253" class="field">uma instância por cartão</text><rect x="760" y="145" width="285" height="175" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><rect x="760" y="145" width="285" height="34" rx="10" fill="#059669"/><rect x="760" y="169" width="285" height="10" fill="#059669"/><text x="772" y="167" class="section">CARTOES_FISICOS</text><text x="772" y="199" class="field">cartao_id (1:1)</text><text x="772" y="216" class="field">permite_compras_online</text><text x="772" y="233" class="field">default: false</text><rect x="760" y="365" width="300" height="185" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="760" y="365" width="300" height="34" rx="10" fill="#7c3aed"/><rect x="760" y="389" width="300" height="10" fill="#7c3aed"/><text x="772" y="387" class="section">CARTOES_VIRTUAIS</text><text x="772" y="419" class="field">cartao_id (1:1)</text><text x="772" y="436" class="field">cartao_fisico_id (obrigatório)</text><text x="772" y="453" class="field">mesma conta/modalidade</text><rect x="1135" y="340" width="295" height="185" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="1135" y="340" width="295" height="34" rx="10" fill="#d97706"/><rect x="1135" y="364" width="295" height="10" fill="#d97706"/><text x="1147" y="362" class="section">AVISOS_VIAGEM</text><text x="1147" y="394" class="field">conta_id • cartao_id</text><text x="1147" y="411" class="field">período • localidades</text><text x="1147" y="428" class="field">status</text><rect x="70" y="515" width="300" height="220" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="70" y="515" width="300" height="34" rx="10" fill="#d97706"/><rect x="70" y="539" width="300" height="10" fill="#d97706"/><text x="82" y="537" class="section">LIMITES_PIX</text><text x="82" y="569" class="field">limite_diario / noturno</text><text x="82" y="586" class="field">limite_sem_chave_*</text><text x="82" y="603" class="field">horários de janela</text><rect x="445" y="545" width="335" height="205" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="445" y="545" width="335" height="34" rx="10" fill="#dc2626"/><rect x="445" y="569" width="335" height="10" fill="#dc2626"/><text x="457" y="567" class="section">CONSUMOS_LIMITES_PIX</text><text x="457" y="599" class="field">conta_id • data_referencia</text><text x="457" y="616" class="field">janela DIURNA/NOTURNA</text><text x="457" y="633" class="field">utilizado + reservado</text><rect x="70" y="875" width="310" height="180" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><rect x="70" y="875" width="310" height="34" rx="10" fill="#059669"/><rect x="70" y="899" width="310" height="10" fill="#059669"/><text x="82" y="897" class="section">CHAVES_PIX</text><text x="82" y="929" class="field">status ATIVA/DESATIVADA</text><text x="82" y="946" class="field">conta_id • valor_chave</text><text x="82" y="963" class="field">seleciona política sem chave</text><rect x="470" y="880" width="350" height="205" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="470" y="880" width="350" height="34" rx="10" fill="#7c3aed"/><rect x="470" y="904" width="350" height="10" fill="#7c3aed"/><text x="482" y="902" class="section">ASSINATURAS_CARTAO</text><text x="482" y="934" class="field">cartao_id • conta_id</text><text x="482" y="951" class="field">estabelecimento • periodicidade</text><text x="482" y="968" class="field">última/próxima cobrança</text><rect x="900" y="875" width="300" height="190" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/><rect x="900" y="875" width="300" height="34" rx="10" fill="#0ea5e9"/><rect x="900" y="899" width="300" height="10" fill="#0ea5e9"/><text x="912" y="897" class="section">AGENDAMENTOS</text><text x="912" y="929" class="field">conta_id • transacao_id</text><text x="912" y="946" class="field">status + tentativas</text><text x="912" y="963" class="field">chave_idempotencia</text><rect x="1280" y="845" width="370" height="245" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><rect x="1280" y="845" width="370" height="34" rx="10" fill="#0f172a"/><rect x="1280" y="869" width="370" height="10" fill="#0f172a"/><text x="1292" y="867" class="section">LOGS_AUDITORIA</text><text x="1292" y="899" class="field">tabela • registro_id • operação</text><text x="1292" y="916" class="field">antes / depois / diff JSONB</text><text x="1292" y="933" class="field">append-only + hash</text><rect x="1300" y="145" width="300" height="160" rx="10" fill="#ffffff" stroke="#475569" stroke-width="1.6"/><rect x="1300" y="145" width="300" height="34" rx="10" fill="#475569"/><rect x="1300" y="169" width="300" height="10" fill="#475569"/><text x="1312" y="167" class="section">TRANSACOES</text><text x="1312" y="199" class="field">id • tipo • status</text><text x="1312" y="216" class="field">chave_idempotencia</text><text x="1312" y="233" class="field">origem de recorrência</text><line x1="340" y1="245" x2="400" y2="245" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="370.0" y="239.0" class="label" text-anchor="middle">emite</text><line x1="680" y1="220" x2="760" y2="220" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720.0" y="214.0" class="label" text-anchor="middle">forma física</text><path d="M 680 300 L 720 300 L 720 455 L 760 455" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="720" y="390" class="label" text-anchor="middle">forma virtual</text><line x1="905" y1="320" x2="905" y2="365" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="905.0" y="334.5" class="label" text-anchor="middle">origina</text><path d="M 680 280 L 1080 280 L 1135 390" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="930" y="270" class="label" text-anchor="middle">recebe aviso</text><path d="M 340 300 L 390 300 L 390 625 L 445 625" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="410" y="460" class="label" text-anchor="middle">configura</text><line x1="370" y1="625" x2="445" y2="625" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/><text x="407.5" y="619.0" class="label" text-anchor="middle">mede consumo</text><path d="M 340 315 L 1135 315 L 1135 430" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="305" class="label" text-anchor="middle">escopa</text><path d="M 680 280 L 820 280 L 820 980" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="640" class="label" text-anchor="middle">consulta</text><line x1="1300" y1="225" x2="1450" y2="845" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1405.0" y="527.0" class="label" text-anchor="middle">detecta/efetiva</text><path d="M 340 300 L 850 300 L 900 970" fill="none" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="610" y="295" class="label" text-anchor="middle">programa</text><line x1="1200" y1="960" x2="1280" y2="960" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1240.0" y="954.0" class="label" text-anchor="middle">efetiva</text><line x1="220" y1="735" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="625" y1="750" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="1110" y1="525" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="1430" y1="305" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="625" y1="1085" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="1050" y1="1065" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><line x1="390" y1="970" x2="1280" y2="930" stroke="#475569" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><rect x="70" y="1115" width="920" height="82" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="82" y="1136" class="note">Regra de integridade: o virtual aponta para uma instância de CARTOES com conta_id;</text><text x="82" y="1153" class="note">o serviço valida que físico e virtual pertencem à mesma conta e modalidade antes do INSERT.</text><rect x="1020" y="1115" width="650" height="82" rx="8" fill="#fffbeb" stroke="#2563eb" stroke-width="1.3"/><text x="1032" y="1136" class="note">A trilha registra alterações de estado;</text><text x="1032" y="1153" class="note">ACESSO/CONSULTA entram pelo middleware, não por trigger de SELECT.</text></svg>