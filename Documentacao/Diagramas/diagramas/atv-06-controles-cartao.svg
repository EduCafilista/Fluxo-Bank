<rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="100%" height="116" fill="#f8fafc"/>
<text x="48" y="46" class="title">ATV-06 — controles de cartão e aviso de viagem</text>
<text x="48" y="78" class="subtitle">Atividade combinada para cartão virtual, autorização on-line, risco e consulta de assinaturas.</text><rect x="600" y="150" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="750.0" y="175" class="entity" text-anchor="middle">Solicitar cartão virtual</text><polygon points="750,230.0 950.0,285 750,340.0 550.0,285" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/><text x="750" y="277" class="small" text-anchor="middle">Físico ativo, mesma</text><text x="750" y="293" class="small" text-anchor="middle">conta e modalidade?</text><rect x="330" y="400" width="300" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="480.0" y="425" class="entity" text-anchor="middle">Recusar e auditar</text><text x="480.0" y="442" class="entity" text-anchor="middle">o motivo</text><rect x="600" y="400" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text x="750.0" y="425" class="entity" text-anchor="middle">Criar cartão virtual</text><text x="750.0" y="442" class="entity" text-anchor="middle">(cartoes + origem física)</text><rect x="600" y="545" width="300" height="70" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.8"/><text x="750.0" y="570" class="entity" text-anchor="middle">Receber compra</text><polygon points="750,627.5 950.0,680 750,732.5 550.0,680" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/><text x="750" y="672" class="small" text-anchor="middle">Canal ONLINE?</text><polygon points="750,775.0 970.0,830 750,885.0 530.0,830" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/><text x="750" y="822" class="small" text-anchor="middle">Flag online habilitada</text><text x="750" y="838" class="small" text-anchor="middle">e status/limite válidos?</text><rect x="1080" y="900" width="300" height="70" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.8"/><text x="1230.0" y="925" class="entity" text-anchor="middle">Negar compra</text><text x="1230.0" y="942" class="entity" text-anchor="middle">sem lançamento</text><polygon points="750,930.0 970.0,980 750,1030.0 530.0,980" fill="#fff7ed" stroke="#d97706" stroke-width="1.8"/><text x="750" y="972" class="small" text-anchor="middle">Aviso válido para</text><text x="750" y="988" class="small" text-anchor="middle">este cartão/local/período?</text><rect x="600" y="1080" width="300" height="70" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="1.8"/><text x="750.0" y="1105" class="entity" text-anchor="middle">Autorizar + auditar</text><text x="750.0" y="1122" class="entity" text-anchor="middle">+ atualizar recorrência</text><rect x="1080" y="720" width="300" height="70" rx="10" fill="#f8fafc" stroke="#475569" stroke-width="1.8"/><text x="1230.0" y="745" class="entity" text-anchor="middle">Seguir regras gerais</text><text x="1230.0" y="762" class="entity" text-anchor="middle">de status e limite</text><line x1="750" y1="220" x2="750" y2="230" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="650" y1="285" x2="480" y2="400" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/><text x="565.0" y="334.5" class="label" text-anchor="middle">não</text><line x1="750" y1="340" x2="750" y2="400" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="750.0" y="362.0" class="label" text-anchor="middle">sim</text><line x1="750" y1="470" x2="750" y2="545" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="750" y1="615" x2="750" y2="628" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="930" y1="680" x2="1080" y2="720" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow-gray)"/><text x="1005.0" y="692.0" class="label" text-anchor="middle">não</text><line x1="750" y1="732" x2="750" y2="775" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="750.0" y="745.5" class="label" text-anchor="middle">sim</text><line x1="930" y1="830" x2="1080" y2="900" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/><text x="1005.0" y="857.0" class="label" text-anchor="middle">não</text><line x1="750" y1="885" x2="750" y2="930" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="750.0" y="899.5" class="label" text-anchor="middle">sim</text><line x1="530" y1="980" x2="440" y2="1080" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="485.0" y="1022.0" class="label" text-anchor="middle">não → risco/2FA</text><line x1="750" y1="1030" x2="750" y2="1080" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="750.0" y="1047.0" class="label" text-anchor="middle">sim</text><rect x="80" y="190" width="360" height="140" rx="8" fill="#fffbeb" stroke="#dc2626" stroke-width="1.3"/><text x="92" y="211" class="note">Físico bloqueado, de outra conta</text><text x="92" y="228" class="note">ou modalidade divergente:</text><text x="92" y="245" class="note">não há virtual.</text><rect x="1120" y="190" width="380" height="140" rx="8" fill="#fffbeb" stroke="#059669" stroke-width="1.3"/><text x="1132" y="211" class="note">A flag permite somente o canal</text><text x="1132" y="228" class="note">ONLINE; compras presenciais</text><text x="1132" y="245" class="note">seguem política geral.</text><rect x="1110" y="1010" width="390" height="120" rx="8" fill="#fffbeb" stroke="#7c3aed" stroke-width="1.3"/><text x="1122" y="1031" class="note">A recorrência identificada</text><text x="1122" y="1048" class="note">atualiza assinaturas_cartao,</text><text x="1122" y="1065" class="note">não a assinatura do Fluxo.</text></svg>