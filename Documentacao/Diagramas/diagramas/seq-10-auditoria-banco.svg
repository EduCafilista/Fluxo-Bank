<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1140" viewBox="0 0 1900 1140">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/></marker>
  <style>
    .title{font:700 28px Arial,sans-serif;fill:#0f172a}
    .subtitle{font:400 15px Arial,sans-serif;fill:#475569}
    .section{font:700 14px Arial,sans-serif;fill:white;letter-spacing:.5px}
    .entity{font:700 15px Arial,sans-serif;fill:#0f172a}
    .field{font:400 12px Arial,sans-serif;fill:#475569}
    .small{font:400 11px Arial,sans-serif;fill:#475569}
