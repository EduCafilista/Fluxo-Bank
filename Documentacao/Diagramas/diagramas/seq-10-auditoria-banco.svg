<rect width="100%" height="100%" fill="white"/>
<rect x="0" y="0" width="100%" height="116" fill="#f8fafc"/>
<text x="48" y="46" class="title">SEQ-10 — auditoria de alterações do banco</text>
<text x="48" y="78" class="subtitle">Duas camadas: triggers para estado e middleware para acesso/consulta.</text><rect x="35" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.7"/><text x="120" y="171" class="actor" text-anchor="middle">Ator</text><line x1="120" y1="187" x2="120" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="300" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.7"/><text x="385" y="171" class="actor" text-anchor="middle">Middleware</text><line x1="385" y1="187" x2="385" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="575" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.7"/><text x="660" y="171" class="actor" text-anchor="middle">Serviço</text><line x1="660" y1="187" x2="660" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="855" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#475569" stroke-width="1.7"/><text x="940" y="171" class="actor" text-anchor="middle">PostgreSQL</text><line x1="940" y1="187" x2="940" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1125" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.7"/><text x="1210" y="171" class="actor" text-anchor="middle">Trigger</text><line x1="1210" y1="187" x2="1210" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1405" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="1.7"/><text x="1490" y="171" class="actor" text-anchor="middle">logs_auditoria</text><line x1="1490" y1="187" x2="1490" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="1675" y="145" width="170" height="42" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="1.7"/><text x="1760" y="171" class="actor" text-anchor="middle">AuditoriaService</text><line x1="1760" y1="187" x2="1760" y2="1010" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/><line x1="120" y1="235" x2="385" y2="235" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="252.5" y="227" class="msg" text-anchor="middle">requisição</text><rect x="379" y="220" width="12" height="75" rx="3" fill="#0ea5e9" stroke="#0ea5e9" stroke-width="1"/><line x1="385" y1="310" x2="940" y2="310" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="662.5" y="302" class="msg" text-anchor="middle">SET LOCAL app.*</text><rect x="934" y="295" width="12" height="110" rx="3" fill="#475569" stroke="#475569" stroke-width="1"/><line x1="385" y1="390" x2="660" y2="390" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="522.5" y="382" class="msg" text-anchor="middle">delega operação</text><rect x="654" y="375" width="12" height="110" rx="3" fill="#059669" stroke="#059669" stroke-width="1"/><line x1="660" y1="470" x2="940" y2="470" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="800.0" y="462" class="msg" text-anchor="middle">INSERT / UPDATE / DELETE</text><rect x="934" y="455" width="12" height="230" rx="3" fill="#475569" stroke="#475569" stroke-width="1"/><line x1="940" y1="550" x2="1210" y2="550" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1075.0" y="542" class="msg" text-anchor="middle">OLD + NEW</text><rect x="1204" y="535" width="12" height="145" rx="3" fill="#d97706" stroke="#d97706" stroke-width="1"/><line x1="1210" y1="625" x2="1490" y2="625" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1350.0" y="617" class="msg" text-anchor="middle">sanitiza, diff, hash</text><rect x="1484" y="610" width="12" height="120" rx="3" fill="#0f172a" stroke="#0f172a" stroke-width="1"/><line x1="1490" y1="695" x2="1210" y2="695" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1350.0" y="687" class="msg" text-anchor="middle">append INSERT</text><line x1="1210" y1="750" x2="940" y2="750" stroke="#059669" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow)"/><text x="1075.0" y="742" class="msg" text-anchor="middle">commit junto da operação</text><rect x="260" y="785" width="1420" height="155" rx="10" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.4"/><text x="280" y="812" class="entity">ACESSO / CONSULTA — não existe trigger de SELECT</text><line x1="120" y1="855" x2="385" y2="855" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="252.5" y="847" class="msg" text-anchor="middle">login, logout ou leitura</text><line x1="385" y1="900" x2="1760" y2="900" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1072.5" y="892" class="msg" text-anchor="middle">AuditoriaService registra categoria</text><rect x="1754" y="880" width="12" height="80" rx="3" fill="#7c3aed" stroke="#7c3aed" stroke-width="1"/><line x1="1760" y1="950" x2="1490" y2="950" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1625.0" y="942" class="msg" text-anchor="middle">INSERT somente append-only</text><line x1="1490" y1="1000" x2="1760" y2="1000" stroke="#475569" stroke-width="1.8" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/><text x="1625.0" y="992" class="msg" text-anchor="middle">auditor consulta SELECT</text><rect x="80" y="1025" width="760" height="64" rx="8" fill="#fffbeb" stroke="#dc2626" stroke-width="1.3"/><text x="92" y="1046" class="note">Senha, token, CVV e hashes são removidos antes de</text><text x="92" y="1063" class="note">preencher antes/depois/diff.</text><rect x="1050" y="1025" width="730" height="64" rx="8" fill="#fffbeb" stroke="#0f172a" stroke-width="1.3"/><text x="1062" y="1046" class="note">UPDATE/DELETE em logs_auditoria geram exceção;</text><text x="1062" y="1063" class="note">o log mínimo acompanha o commit da operação.</text></svg>