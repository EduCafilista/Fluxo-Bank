<text x="48" y="46" class="title">CLS-05 — classes dos controles operacionais</text>
<text x="48" y="78" class="subtitle">Novas classes e invariantes da revisão 4.0.</text><rect x="60" y="160" width="260" height="170" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.6"/><rect x="60" y="160" width="260" height="34" rx="10" fill="#2563eb"/><rect x="60" y="184" width="260" height="10" fill="#2563eb"/><text x="72" y="182" class="section">Conta</text><text x="72" y="214" class="field">status: StatusConta</text><text x="72" y="231" class="field">statusAbertura: StatusAbertura</text><text x="72" y="248" class="field">bloqueada: bool</text><rect x="400" y="160" width="260" height="170" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/><rect x="400" y="160" width="260" height="34" rx="10" fill="#0ea5e9"/><rect x="400" y="184" width="260" height="10" fill="#0ea5e9"/><text x="412" y="182" class="section">Cartao</text><text x="412" y="214" class="field">contaId: UUID</text><text x="412" y="231" class="field">modalidade</text><text x="412" y="248" class="field">status</text><rect x="750" y="125" width="300" height="185" rx="10" fill="#ffffff" stroke="#059669" stroke-width="1.6"/><rect x="750" y="125" width="300" height="34" rx="10" fill="#059669"/><rect x="750" y="149" width="300" height="10" fill="#059669"/><text x="762" y="147" class="section">CartaoFisico</text><text x="762" y="179" class="field">cartaoId: UUID</text><text x="762" y="196" class="field">permiteComprasOnline: bool</text><text x="762" y="213" class="field">default false</text><rect x="750" y="365" width="300" height="185" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="750" y="365" width="300" height="34" rx="10" fill="#7c3aed"/><rect x="750" y="389" width="300" height="10" fill="#7c3aed"/><text x="762" y="387" class="section">CartaoVirtual</text><text x="762" y="419" class="field">cartaoId: UUID</text><text x="762" y="436" class="field">cartaoFisicoId: UUID</text><text x="762" y="453" class="field">geradoEm: datetime</text><rect x="60" y="480" width="300" height="215" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="60" y="480" width="300" height="34" rx="10" fill="#d97706"/><rect x="60" y="504" width="300" height="10" fill="#d97706"/><text x="72" y="502" class="section">LimitePix</text><text x="72" y="534" class="field">limiteDiario</text><text x="72" y="551" class="field">limiteNoturnoDiario</text><text x="72" y="568" class="field">limiteSemChaveDiario</text><text x="72" y="585" class="field">vigencia/hora</text><rect x="430" y="500" width="320" height="195" rx="10" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/><rect x="430" y="500" width="320" height="34" rx="10" fill="#dc2626"/><rect x="430" y="524" width="320" height="10" fill="#dc2626"/><text x="442" y="522" class="section">ConsumoLimitePix</text><text x="442" y="554" class="field">dataReferencia</text><text x="442" y="571" class="field">janela</text><text x="442" y="588" class="field">valorUtilizado</text><text x="442" y="605" class="field">valorReservado</text><rect x="850" y="650" width="305" height="190" rx="10" fill="#ffffff" stroke="#d97706" stroke-width="1.6"/><rect x="850" y="650" width="305" height="34" rx="10" fill="#d97706"/><rect x="850" y="674" width="305" height="10" fill="#d97706"/><text x="862" y="672" class="section">AvisoViagem</text><text x="862" y="704" class="field">contaId • cartaoId</text><text x="862" y="721" class="field">dataInicio / dataFim</text><text x="862" y="738" class="field">localidades • status</text><rect x="1210" y="170" width="350" height="205" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="1.6"/><rect x="1210" y="170" width="350" height="34" rx="10" fill="#7c3aed"/><rect x="1210" y="194" width="350" height="10" fill="#7c3aed"/><text x="1222" y="192" class="section">AssinaturaCartao</text><text x="1222" y="224" class="field">cartaoId • contaId</text><text x="1222" y="241" class="field">estabelecimento • periodicidade</text><text x="1222" y="258" class="field">status • próxima cobrança</text><rect x="1210" y="485" width="350" height="220" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="1.6"/><rect x="1210" y="485" width="350" height="34" rx="10" fill="#0ea5e9"/><rect x="1210" y="509" width="350" height="10" fill="#0ea5e9"/><text x="1222" y="507" class="section">Agendamento</text><text x="1222" y="539" class="field">status</text><text x="1222" y="556" class="field">agendadoPara</text><text x="1222" y="573" class="field">tentativas • idempotência</text><text x="1222" y="590" class="field">recorrente • próxima execução</text><rect x="1210" y="815" width="350" height="190" rx="10" fill="#ffffff" stroke="#0f172a" stroke-width="1.6"/><rect x="1210" y="815" width="350" height="34" rx="10" fill="#0f172a"/><rect x="1210" y="839" width="350" height="10" fill="#0f172a"/><text x="1222" y="837" class="section">LogAuditoria</text><text x="1222" y="869" class="field">antes / depois / diff JSONB</text><text x="1222" y="886" class="field">categoria • requestId</text><text x="1222" y="903" class="field">appendOnly()</text><line x1="320" y1="245" x2="400" y2="245" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/><text x="360.0" y="239.0" class="label" text-anchor="middle">1 → 0..*</text><line x1="660" y1="220" x2="750" y2="220" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="705.0" y="214.0" class="label" text-anchor="middle">forma</text><path d="M 660 290 L 710 290 L 710 455 L 750 455" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="710" y="385" class="label" text-anchor="middle">origina</text><line x1="900" y1="310" x2="900" y2="365" stroke="#059669" stroke-width="1.8" marker-end="url(#arrow)"/><text x="900.0" y="331.5" class="label" text-anchor="middle">1 → 0..1</text><path d="M 320 275 L 1160 275 L 1210 570" fill="none" stroke="#0ea5e9" stroke-width="1.8" marker-end="url(#arrow)"/><text x="830" y="265" class="label" text-anchor="middle">programa</text><path d="M 660 290 L 800 290 L 850 745" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="760" y="305" class="label" text-anchor="middle">aviso</text><path d="M 320 325 L 380 325 L 380 585 L 430 585" fill="none" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/><text x="395" y="470" class="label" text-anchor="middle">configura</text><line x1="360" y1="585" x2="430" y2="585" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/><text x="395.0" y="579.0" class="label" text-anchor="middle">acumula</text><path d="M 660 300 L 1100 300 L 1210 270" fill="none" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/><text x="970" y="285" class="label" text-anchor="middle">consulta</text><line x1="1385" y1="375" x2="1385" y2="815" stroke="#0f172a" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><text x="1385.0" y="589.0" class="label" text-anchor="middle">auditado</text><line x1="1385" y1="705" x2="1385" y2="815" stroke="#0f172a" stroke-width="1.8" stroke-dasharray="6 6" marker-end="url(#arrow-gray)"/><rect x="60" y="790" width="710" height="115" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="72" y="811" class="note">Invariante CartaoVirtual:</text><text x="72" y="828" class="note">físico ATIVO + mesma conta + mesma modalidade antes de criar a instância virtual.</text><rect x="820" y="900" width="340" height="100" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.3"/><text x="832" y="921" class="note">LimitePix:</text><text x="832" y="938" class="note">sem chave ativa → menor teto entre janela e limite_sem_chave_*.</text><rect x="1210" y="1030" width="350" height="70" rx="8" fill="#fffbeb" stroke="#dc2626" stroke-width="1.3"/><text x="1222" y="1051" class="note">LogAuditoria:</text><text x="1222" y="1068" class="note">não aceita UPDATE/DELETE.</text></svg>