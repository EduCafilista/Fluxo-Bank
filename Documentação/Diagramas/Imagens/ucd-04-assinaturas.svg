<svg viewBox="0 0 940 640" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="assocEnd" markerWidth="1" markerHeight="1"></marker>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#2c5282" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="640" fill="#ffffff"/>

  <!-- Title -->
  <text x="470" y="26" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a202c">Diagrama de Casos de Uso 4 — Assinaturas e Planos</text>

  <!-- System boundary -->
  <rect x="260" y="50" width="560" height="560" rx="6" fill="#f7fafc" stroke="#2c5282" stroke-width="1.6"/>
  <text x="540" y="72" text-anchor="middle" font-size="13" font-style="italic" fill="#2c5282">Fluxo — Assinaturas e Planos</text>

  <!-- Actor: Cliente -->
  <g stroke="#1a202c" stroke-width="1.6" fill="none">
    <circle cx="80" cy="270" r="14"/>
    <line x1="80" y1="284" x2="80" y2="330"/>
    <line x1="55" y1="300" x2="105" y2="300"/>
    <line x1="80" y1="330" x2="60" y2="365"/>
    <line x1="80" y1="330" x2="100" y2="365"/>
  </g>
  <text x="80" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Cliente</text>

  <!-- Actor: Motor de Cobrança -->
  <g stroke="#1a202c" stroke-width="1.6" fill="none">
    <circle cx="865" cy="270" r="14"/>
    <line x1="865" y1="284" x2="865" y2="330"/>
    <line x1="840" y1="300" x2="890" y2="300"/>
    <line x1="865" y1="330" x2="845" y2="365"/>
    <line x1="865" y1="330" x2="885" y2="365"/>
  </g>
  <text x="865" y="385" text-anchor="middle" font-size="12" fill="#1a202c">Motor de</text>
  <text x="865" y="399" text-anchor="middle" font-size="12" fill="#1a202c">Cobrança</text>
  <text x="865" y="413" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«sistema»</text>

  <!-- Use case ellipses -->
  <g font-size="11" fill="#1a202c" text-anchor="middle">
    <ellipse cx="420" cy="105" rx="120" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="420" y="101">ASS-01</text>
    <text x="420" y="115">Contratar plano/assinatura</text>

    <ellipse cx="420" cy="185" rx="120" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="420" y="181">ASS-02</text>
    <text x="420" y="195">Incluir item na assinatura</text>

    <ellipse cx="420" cy="265" rx="120" ry="32" fill="#fdf3e0" stroke="#b7791f" stroke-width="1.4"/>
    <text x="420" y="261">ASS-03</text>
    <text x="420" y="275">Retirar item da assinatura</text>

    <ellipse cx="420" cy="345" rx="120" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="420" y="341">ASS-04</text>
    <text x="420" y="355">Trocar de plano (up/downgrade)</text>

    <ellipse cx="420" cy="425" rx="120" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="420" y="421">ASS-06</text>
    <text x="420" y="435">Pagar fatura da assinatura</text>

    <ellipse cx="420" cy="505" rx="120" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="420" y="501">ASS-07</text>
    <text x="420" y="515">Cancelar assinatura</text>

    <ellipse cx="655" cy="145" rx="110" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="655" y="141">ASS-05</text>
    <text x="655" y="155">Gerar cobrança do ciclo</text>

    <ellipse cx="655" cy="465" rx="110" ry="32" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.4"/>
    <text x="655" y="459">ASS-08</text>
    <text x="655" y="472">Suspender assinatura</text>
    <text x="655" y="484">por atraso</text>
  </g>

  <!-- Associations (Cliente) -->
  <g stroke="#1a202c" stroke-width="1.2">
    <line x1="105" y1="272" x2="300" y2="115"/>
    <line x1="105" y1="280" x2="300" y2="190"/>
    <line x1="105" y1="285" x2="300" y2="265"/>
    <line x1="105" y1="292" x2="300" y2="340"/>
    <line x1="105" y1="300" x2="300" y2="420"/>
    <line x1="105" y1="310" x2="300" y2="500"/>
  </g>

  <!-- Associations (Motor de Cobrança) -->
  <g stroke="#1a202c" stroke-width="1.2">
    <line x1="840" y1="278" x2="740" y2="150"/>
    <line x1="840" y1="300" x2="740" y2="460"/>
  </g>

  <!-- include / extend -->
  <g stroke="#2c5282" stroke-width="1.2" stroke-dasharray="6,4" fill="none" marker-end="url(#openArrow)">
    <!-- ASS-01 include ASS-05 (outer lane, top) -->
    <path d="M540,102 C605,95 618,115 588,138"/>
    <!-- ASS-06 include ASS-05 (outer lane, right side, far bulge) -->
    <path d="M535,405 C740,400 740,160 592,152"/>
    <!-- ASS-02 extend ASS-01 (short, straight) -->
    <path d="M420,153 L420,138"/>
    <!-- ASS-03 extend ASS-01 (inner lane) -->
    <path d="M542,258 C572,220 572,140 542,118"/>
    <!-- ASS-08 extend ASS-06 (small loop) -->
    <path d="M548,450 C505,442 488,432 542,426"/>
  </g>
  <g font-size="10" font-style="italic" fill="#2c5282">
    <text x="600" y="95">«include»</text>
    <text x="700" y="280">«include»</text>
    <text x="335" y="147">«extend»</text>
    <text x="578" y="195">«extend»</text>
    <text x="465" y="450">«extend»</text>
  </g>

  <!-- Legend -->
  <g font-size="10" fill="#4a5568">
    <text x="270" y="600">RN22: ASS-03 remove item sem exclusão física (dataExclusao/motivoExclusao).</text>
  </g>
</svg>
