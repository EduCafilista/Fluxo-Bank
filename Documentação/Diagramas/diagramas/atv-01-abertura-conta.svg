y="70" /><text fill="#1e293b" font-family="Segoe UI, Arial" font-size="11px" font-weight="700" text-anchor="middle" x="740.0" y="88">Backoffice / KYC</text><rect fill="#ffffff" height="50" rx="8" stroke="#1e293b" stroke-width="1.5" width="220" x="50" y="120" /><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="160.0" y="138">Preenche cadastro:</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="160.0" y="152"> nome, CPF ou CNPJ,</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="160.0" y="166"> email, senha</text><rect fill="#ffffff" height="55" rx="8" stroke="#1e293b" stroke-width="1.5" width="220" x="340" y="210" /><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="450.0" y="228">Tipo cliente = PJ?</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="450.0" y="242">[PF] valida CPF</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="450.0" y="256">[PJ] valida CNPJ + razão</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="450.0" y="270"> social + representante</text><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="10.5px" text-anchor="middle" x="450.0" y="284"> RN35 matemática</text><polygon fill="#ffffff" points="450,282 478,310 450,338 422,310" stroke="#1e293b" stroke-width="1.5" /><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="450" y="270">Dados válidos?</text><text fill="#b91c1c" font-family="Segoe UI, Arial" font-size="9px" x="200" y="315">[nao] Exibe erros, volta ao form</text><text fill="#0f6f5c" font-family="Segoe UI, Arial" font-size="9px" x="580" y="315">[sim] Grava PENDENTE</text><rect fill="#ffffff" height="45" rx="8" stroke="#1e293b" stroke-width="1.5" wid