<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="950px" version="1.1" viewBox="0 0 1100 950" width="1100px" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1b2430" /></marker><marker id="arrow-blue" markerHeight="7" markerWidth="7" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" /></marker></defs><rect fill="white" height="100%" width="100%" x="0" y="0" /><text fill="#0f172a" font-family="Segoe UI, Arial" font-size="13px" font-weight="700" text-anchor="middle" x="550" y="28">CMP-01 — Diagrama de Componentes — REVISADO v3.0 — MVC + Token + PF/PJ + QR Code + Antifraude expandido</text><text fill="#475569" font-family="Segoe UI, Arial" font-size="10px" text-anchor="middle" x="550" y="48">RF16 MVC RF17 Token RF10-RF12 especialização RF15 QR Code RN27-32 antifraude RF-SEG04 logs</text><rect fill="#eff6ff" height="90" stroke="#93c5fd" stroke-width="1" width="1060" x="20" y="70" /><text fill="#1e40af" font-family="Segoe UI, Arial" font-size="10px" font-weight="700" x="30" y="85">Camada Apresentação (View) — Blade + Tailwind + Flutter</text><rect fill="white" height="55" rx="4" stroke="#2563eb" width="200" x="30" y="95" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="600" text-anchor="middle" x="130" y="110">App Mobile (Flutter)</text><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="130" y="125">Login, Dashboard, Pix, QR Code</text><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="130" y="138">Cartões Físico/Virtual</text><rect fill="white" height="55" rx="4" stroke="#2563eb" width="200" x="250" y="95" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="600" text-anchor="middle" x="350" y="110">Web App (Blade)</text><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="350" y="125">Tailwind CSS + Blade</text><rect fill="white" height="55" rx="4" stroke="#2563eb" width="200" x="470" y="95" /><text font-family="Segoe UI, Arial" font-size="10px" font-weight="600" text-anchor="middle" x="570" y="110">Portal Admin (Blade)</text><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="570" y="125">Backoffice, Auditoria</text><rect fill="#fef3c7" height="70" stroke="#fbbf24" stroke-width="1" width="1060" x="20" y="175" /><text fill="#92400e" font-family="Segoe UI, Arial" font-size="10px" font-weight="700" x="30" y="190">Camada Fronteira (Controller) — API REST v1 + Sanctum Token (RF17)</text><rect fill="white" height="35" rx="4" stroke="#f59e0b" width="1020" x="30" y="200" /><text font-family="Segoe UI, Arial" font-size="9px" text-anchor="middle" x="540" y="222">«gateway» API REST v1 — Authorization: Bearer &lt;token&gt; — rate limiting — versionamento /api/v1 — Controllers finos (validação e orquestração)</text><rect fill="#ecfdf5" height="420" stroke="#6ee7b7" stroke-width="1" width="1060" x="20" y="260" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="10px" font-weight="700" x="30" y="275">Camada Domínio (Service + Model) — MVC — Models Eloquent com especialização PF/PJ, Contas, Cartões — Services com regra de negócio (RF16)</text><rect fill="white" height="85" rx="4" stroke="#059669" width="200" x="30" y="285" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="130" y="300">AuthService RF02 RF17</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="130" y="315">login() emitirToken() validar2FA()</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="130" y="328">refreshToken() revogarToken()</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="130" y="341">Token Sanctum TTL 60min</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="130" y="354">2FA 6 dígitos SHA-256</text><rect fill="white" height="85" rx="4" stroke="#059669" width="200" x="250" y="285" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="350" y="300">CadastroService RF01 RF10</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="350" y="315">cadastrar() PF ou PJ</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="350" y="328">verificarKyc() abrirConta()</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="350" y="341">RN35 valida CPF/CNPJ</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="350" y="354">RF11 ContaCorrente/Poup/Sal/PJ</text><rect fill="white" height="85" rx="4" stroke="#059669" width="200" x="470" y="285" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="570" y="300">ContaService RF03 RF13</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="570" y="315">saldo() extrato() encerrar()</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="570" y="328">bloquear() desbloquear() RF13</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="570" y="341">bloqueada:boolean RN34</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="570" y="354">saldo derivado SUM(lançamentos)</text><rect fill="white" height="85" rx="4" stroke="#059669" width="180" x="690" y="285" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="780" y="300">MotorTransacao</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="780" y="315">transferir() partidasDobradas()</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="780" y="328">estornar() RN02 RN03 ACID</text><rect fill="#fef2f2" height="115" rx="4" stroke="#dc2626" width="330" x="30" y="385" /><text fill="#991b1b" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="195" y="400">MotorAntifraude RF05 RN27-RN32 EXPANDIDO</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="195" y="415">analisar() verificarSaldo() RN27</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="195" y="428">verificarLimites() RN28-30</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="195" y="441">  - valor por transação RN28</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="195" y="453">  - diário valor/qtd RN29</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="195" y="465">  - horário noturno 20h-6h RN30</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="195" y="477">verificarLocalizacao() RN32</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="195" y="489">verificarAvisoViagem() RN31</text><rect fill="white" height="115" rx="4" stroke="#059669" width="210" x="380" y="385" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="485" y="400">CartoesService RF07 RF12 RN33</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="485" y="415">emitirFisico() Débito/Crédito</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="485" y="428">gerarVirtual() a partir físico</text><text fill="#b91c1c" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="485" y="441">RN33: virtual depende físico ativo</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="485" y="453">Físico existe sem virtual</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="485" y="465">bloquear() fatura() limite</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="485" y="477">CartaoFisico 1—0..1 CartaoVirtual</text><rect fill="white" height="115" rx="4" stroke="#059669" width="210" x="610" y="385" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="715" y="400">PagamentosService RF08 RF15</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="715" y="415">pagarBoleto() cobrancaPix()</text><text fill="#1e40af" font-family="Segoe UI, Arial" font-size="8px" font-weight="700" text-anchor="middle" x="715" y="428">gerarQrCodePix() NOVO RF15</text><text fill="#047857" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="715" y="441">RN36 payload EMV</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="715" y="453">QR Code imagem local</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="715" y="465">agendar() recorrente</text><rect fill="white" height="215" rx="4" stroke="#059669" width="240" x="840" y="285" /><text fill="#065f46" font-family="Segoe UI, Arial" font-size="9.5px" font-weight="700" text-anchor="middle" x="960" y="300">AssinaturaService + Transversais</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="960" y="315">contratar() adicionarItem()</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="960" y="328">removerItem() RN22 sem DELETE</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="960" y="341">gerarCobranca() proporcional RN23</text><text fill="#991b1b" font-family="Segoe UI, Arial" font-size="9px" font-weight="700" text-anchor="middle" x="960" y="360">AuditoriaService RF-SEG01-04</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="960" y="375">RF-SEG04: log ACESSO/CONSULTA/</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="960" y="388">MOVIMENTACAO - espelha tabelas</text><text font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="960" y="401">append-only + hash encadeado</text><text font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="960" y="420">NotificacoesService fila</text><rect fill="#f0f9ff" height="75" rx="4" stroke="#0ea5e9" width="1050" x="30" y="515" /><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="555" y="535">Padrão MVC (RF16): Model (Eloquent) = ClientePF/PJ, ContaCorrente/Poupanca/Salario/PJ, CartaoFisico/Virtual, LogAuditoria | View = Blade + Tailwind (Web) + API Resources JSON (App) | Controller = Auth, Transacao, Retirada, Cartao, Assinatura (validação e orquestração, sem regra de negócio)</text><text fill="#0369a1" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="555" y="555">Regra de negócio isolada em Services — testabilidade RNF — token Sanctum emitido no login e validado em toda rota protegida</text><text fill="#0369a1" font-family="Segoe UI, Arial" font-size="8px" text-anchor="middle" x="555" y="572">Models especializados com Single Table Inheritance (tipo discriminador) — sem coluna saldo — bloqueada:boolean — tokenAcesso — cvvHash bcrypt custo 12</text><rect fill="#f5f3ff" height="100" stroke="#a78bfa" stroke-width="1" width="1060" x="20" y="605" /><text fill="#5b21b6" font-family="Segoe UI, Arial" font-size="10px" font-weight="700" x="30" y="620">Camada Persistência — Eloquent ORM + PostgreSQL 16 ACID + numeric(18,2)</text><rect fill="white" height="60" rx="4" stroke="#8b5cf6" width="1040" x="30" y="630" /><text font-family="Segoe UI, Arial" font-size="7.8px" text-anchor="middle" x="550" y="650">Models: Cliente (abstract) → ClientePF (cpf RN35) / ClientePJ (cnpj RN35, razaoSocial, representanteLegal) | Conta (abstract, bloqueada:boolean RF13 RN34) → ContaCorrente/ContaPoupanca/ContaSalario/ContaPJ (RF11) | Cartao → CartaoDebito/Credito → CartaoFisico 1—0..1 CartaoVirtual (RN33) | Transacao 1◆—2..* Lancamento (RN02 RN03 soma zero) | LogAuditoria append-only | Retirada | VerificacaoDoisFatores</text><text fill="#6d28d9" font-family="Segoe UI, Arial" font-size="7.5px" text-anchor="middle" x="550" y="672">Migrations versionam schema + triggers bloqueiam UPDATE/DELETE em logs_auditoria (RF-SEG03) + triggers capturam OLD/NEW JSONB (RF-SEG02) + middleware global loga 100% requisições (RF-SEG01)</text><rect fill="#fff7ed" height="80" stroke="#fb923c" stroke-width="1" width="1060" x="20" y="720" /><text fill="#9a3412" font-family="Segoe UI, Arial" font-size="10px" font-weight="700" x="30" y="735">Camada Externa Simulada — sem integração real BACEN/SPI (fora de escopo)</text><rect fill="white" height="40" rx="4" stroke="#f97316" width="1040" x="30" y="745" /><text font-family="Segoe UI, Arial" font-size="8.5px" text-anchor="middle" x="550" y="768">Serviço KYC (verificarIdentidade) | SPI/Pix (enviarTransferencia) | Registradora boletos (consultar/liquidar) | SMTP/Push FCM | QR Code gerado localmente sem chamada externa (biblioteca local)</text><line marker-end="url(#arrow)" stroke="#1e293b" stroke-width="1.2" x1="550" x2="550" y1="160" y2="175" /><line marker-end="url(#arrow)" stroke="#1e293b" stroke-width="1.2" x1="550" x2="550" y1="245" y2="260" /><line marker-end="url(#arrow)" stroke="#1e293b" stroke-width="1.2" x1="550" x2="550" y1="590" y2="605" /><line marker-end="url(#arrow)" stroke="#1e293b" stroke-width="1.2" x1="550" x2="550" y1="705" y2="720" /></svg>