<svg viewBox="0 0 1300 940" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="genArrow" markerWidth="20" markerHeight="16" refX="18" refY="8" orient="auto">
      <path d="M0,0 L18,8 L0,16 Z" fill="#ffffff" stroke="#2c5282" stroke-width="1.4"/>
    </marker>
    <marker id="depArrow" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#b7791f" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1300" height="940" fill="#ffffff"/>
  <text x="650" y="24" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CLS-04 — Especialização de Clientes, Contas e Cartões</text>

  <!-- ===================== CLIENTE ===================== -->
  <text x="150" y="52" font-size="11" font-weight="bold" fill="#4a5568">Especialização de Cliente (RF10)</text>
  <g>
    <rect x="40" y="60" width="230" height="110" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="40" y1="100" x2="270" y2="100" stroke="#2c5282" stroke-width="1.2"/>
    <text x="155" y="76" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«abstract»</text>
    <text x="155" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Cliente</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="50" y="116">- id: uuid</text>
      <text x="50" y="131">- nome / razaoSocial: string</text>
      <text x="50" y="146">- email: string</text>
      <text x="50" y="161">- status: string</text>
    </g>
  </g>

  <g>
    <rect x="20" y="250" width="160" height="110" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="20" y1="290" x2="180" y2="290" stroke="#2c5282" stroke-width="1.2"/>
    <text x="100" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">ClientePF</text>
    <g font-size="10" fill="#1a202c">
      <text x="28" y="306">- cpf: string</text>
      <text x="28" y="321">(validado — RN35)</text>
      <text x="28" y="341">- dataNascimento</text>
    </g>
  </g>

  <g>
    <rect x="210" y="250" width="220" height="130" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="210" y1="290" x2="430" y2="290" stroke="#2c5282" stroke-width="1.2"/>
    <text x="320" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">ClientePJ</text>
    <g font-size="10" fill="#1a202c">
      <text x="218" y="306">- cnpj: string</text>
      <text x="218" y="321">(validado — RN35)</text>
      <text x="218" y="341">- razaoSocial: string</text>
      <text x="218" y="356">- representanteLegal: string</text>
    </g>
  </g>

  <line x1="100" y1="250" x2="140" y2="170" stroke="#2c5282" stroke-width="1.4" marker-end="url(#genArrow)"/>
  <line x1="320" y1="250" x2="180" y2="170" stroke="#2c5282" stroke-width="1.4" marker-end="url(#genArrow)"/>

  <!-- ===================== CONTA ===================== -->
  <text x="900" y="52" font-size="11" font-weight="bold" fill="#4a5568">Especialização de Conta (RF11)</text>
  <g>
    <rect x="800" y="60" width="260" height="130" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="800" y1="100" x2="1060" y2="100" stroke="#2c5282" stroke-width="1.2"/>
    <text x="930" y="76" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«abstract»</text>
    <text x="930" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Conta</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="810" y="116">- agencia / numero: string</text>
      <text x="810" y="131">- status: string</text>
      <text x="810" y="146">- bloqueada: boolean</text>
      <text x="810" y="161">(autobloqueio — RF13/RN34)</text>
    </g>
  </g>

  <g font-size="10" fill="#1a202c">
    <rect x="560" y="250" width="150" height="95" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="635" y="270" text-anchor="middle" font-size="12.5" font-weight="bold">ContaCorrente</text>
    <line x1="560" y1="278" x2="710" y2="278" stroke="#2c5282" stroke-width="1"/>
    <text x="568" y="296">Associada a ClientePF</text>
    <text x="568" y="311">Uso corrente padrão</text>

    <rect x="730" y="250" width="160" height="95" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="810" y="270" text-anchor="middle" font-size="12.5" font-weight="bold">ContaPoupanca</text>
    <line x1="730" y1="278" x2="890" y2="278" stroke="#2c5282" stroke-width="1"/>
    <text x="738" y="296">Associada a ClientePF</text>
    <text x="738" y="311">- aniversarioRendimento</text>

    <rect x="910" y="250" width="160" height="95" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="990" y="270" text-anchor="middle" font-size="12.5" font-weight="bold">ContaSalario</text>
    <line x1="910" y1="278" x2="1070" y2="278" stroke="#2c5282" stroke-width="1"/>
    <text x="918" y="296">Associada a ClientePF</text>
    <text x="918" y="311">- restricaoSaque: boolean</text>

    <rect x="1090" y="250" width="170" height="95" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="1175" y="270" text-anchor="middle" font-size="12.5" font-weight="bold">ContaPJ</text>
    <line x1="1090" y1="278" x2="1260" y2="278" stroke="#2c5282" stroke-width="1"/>
    <text x="1098" y="296">Associada a ClientePJ</text>
    <text x="1098" y="311">- cnpjVinculado: string</text>
  </g>

  <line x1="635" y1="250" x2="900" y2="190" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>
  <line x1="810" y1="250" x2="915" y2="190" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>
  <line x1="990" y1="250" x2="945" y2="190" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>
  <line x1="1175" y1="250" x2="965" y2="190" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>

  <!-- ===================== CARTAO ===================== -->
  <text x="600" y="420" font-size="11" font-weight="bold" fill="#4a5568">Especialização de Cartão (RF12) — Débito/Crédito × Físico/Virtual</text>

  <g>
    <rect x="560" y="430" width="230" height="130" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="560" y1="470" x2="790" y2="470" stroke="#2c5282" stroke-width="1.2"/>
    <text x="675" y="446" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«abstract»</text>
    <text x="675" y="463" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Cartao</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="570" y="486">- id: uuid</text>
      <text x="570" y="501">- numeroMascarado: string</text>
      <text x="570" y="516">- validade / cvvHash</text>
      <text x="570" y="531">- status: string</text>
    </g>
  </g>

  <g>
    <rect x="380" y="630" width="190" height="90" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="475" y="654" text-anchor="middle" font-size="12.5" font-weight="bold">CartaoDebito</text>
    <line x1="380" y1="662" x2="570" y2="662" stroke="#2c5282" stroke-width="1"/>
    <text x="388" y="682" font-size="10">- usaSaldoConta: boolean</text>
    <text x="388" y="697" font-size="10">Debita a conta direto</text>
  </g>

  <g>
    <rect x="600" y="630" width="210" height="110" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="705" y="654" text-anchor="middle" font-size="12.5" font-weight="bold">CartaoCredito</text>
    <line x1="600" y1="662" x2="810" y2="662" stroke="#2c5282" stroke-width="1"/>
    <text x="608" y="682" font-size="10">- limiteAprovado: numeric</text>
    <text x="608" y="697" font-size="10">- diaFechamentoFatura: int</text>
    <text x="608" y="712" font-size="10">Gera fatura mensal</text>
  </g>

  <line x1="475" y1="630" x2="650" y2="560" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>
  <line x1="705" y1="630" x2="700" y2="560" stroke="#2c5282" stroke-width="1.3" marker-end="url(#genArrow)"/>

  <g>
    <rect x="870" y="630" width="210" height="100" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <text x="975" y="654" text-anchor="middle" font-size="12.5" font-weight="bold">CartaoFisico</text>
    <line x1="870" y1="662" x2="1080" y2="662" stroke="#2c5282" stroke-width="1"/>
    <text x="878" y="682" font-size="10">- dataEntrega: date</text>
    <text x="878" y="697" font-size="10">- enderecoEntrega: string</text>
    <text x="878" y="717" font-size="9.5" font-style="italic" fill="#4a5568">existe de forma independente</text>
  </g>

  <g>
    <rect x="870" y="790" width="210" height="100" fill="#fdf3e0" stroke="#b7791f" stroke-width="1.6"/>
    <text x="975" y="814" text-anchor="middle" font-size="12.5" font-weight="bold">CartaoVirtual</text>
    <line x1="870" y1="822" x2="1080" y2="822" stroke="#b7791f" stroke-width="1"/>
    <text x="878" y="842" font-size="10">- geradoEm: datetime</text>
    <text x="878" y="862" font-size="9.5" font-style="italic" fill="#8a5a10">nunca existe sem um</text>
    <text x="878" y="876" font-size="9.5" font-style="italic" fill="#8a5a10">CartaoFisico ativo (RN33)</text>
  </g>

  <!-- association Cartao -> CartaoFisico -->
  <line x1="790" y1="480" x2="975" y2="630" stroke="#2c5282" stroke-width="1.4"/>
  <text x="795" y="540" font-size="10" fill="#1a202c">1</text>
  <text x="945" y="620" font-size="10" fill="#1a202c">1</text>

  <!-- dependency CartaoVirtual -> CartaoFisico -->
  <line x1="975" y1="790" x2="975" y2="732" stroke="#b7791f" stroke-width="1.6" marker-end="url(#depArrow)"/>
  <text x="985" y="750" font-size="10" fill="#1a202c">1</text>
  <text x="985" y="785" font-size="10" fill="#1a202c">0..1</text>
  <text x="895" y="762" font-size="9.5" font-style="italic" fill="#8a5a10">«gerado a partir de»</text>

  <!-- Note -->
  <rect x="60" y="620" width="270" height="110" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="75" y="640" font-size="10.5" font-weight="bold" fill="#1a202c">Regra RN33</text>
  <text x="75" y="660" font-size="10" fill="#1a202c">Não existe CartaoVirtual sem um</text>
  <text x="75" y="675" font-size="10" fill="#1a202c">CartaoFisico ativo correspondente.</text>
  <text x="75" y="695" font-size="10" fill="#1a202c">O CartaoFisico, porém, existe e</text>
  <text x="75" y="710" font-size="10" fill="#1a202c">opera independentemente de virtual.</text>
</svg>
