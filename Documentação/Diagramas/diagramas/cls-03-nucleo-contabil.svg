<svg viewBox="0 0 970 680" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="diamondFilled" markerWidth="18" markerHeight="12" refX="16" refY="6" orient="auto">
      <path d="M0,6 L8,0 L16,6 L8,12 Z" fill="#2c5282"/>
    </marker>
    <marker id="openArrowCls" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#4a5568" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="970" height="680" fill="#ffffff"/>
  <text x="485" y="22" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a202c">CLS-03 — Núcleo Contábil: Transação e Lançamentos (partidas dobradas)</text>

  <!-- Transacao -->
  <g>
    <rect x="330" y="50" width="290" height="160" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="330" y1="92" x2="620" y2="92" stroke="#2c5282" stroke-width="1.2"/>
    <line x1="330" y1="158" x2="620" y2="158" stroke="#2c5282" stroke-width="1.2"/>
    <text x="475" y="66" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«entity»</text>
    <text x="475" y="83" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Transacao</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="340" y="107">- id: uuid</text>
      <text x="340" y="122">- tipo: TipoTransacao</text>
      <text x="340" y="137">- status: string</text>
      <text x="340" y="152">- chaveIdempotencia: string</text>
    </g>
    <g font-size="10.5" fill="#1a202c">
      <text x="340" y="176">+ efetivar(): void</text>
      <text x="340" y="192">+ estornar(motivo): void</text>
    </g>
  </g>

  <!-- Lancamento -->
  <g>
    <rect x="330" y="320" width="290" height="130" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="330" y1="362" x2="620" y2="362" stroke="#2c5282" stroke-width="1.2"/>
    <line x1="330" y1="418" x2="620" y2="418" stroke="#2c5282" stroke-width="1.2"/>
    <text x="475" y="336" text-anchor="middle" font-size="10" font-style="italic" fill="#4a5568">«entity»</text>
    <text x="475" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Lancamento</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="340" y="377">- id: uuid</text>
      <text x="340" y="392">- tipo: DEBITO | CREDITO</text>
      <text x="340" y="407">- valor: numeric(18,2)</text>
    </g>
    <text x="340" y="436" font-size="10.5" fill="#1a202c">+ aplicar(conta): void</text>
  </g>

  <!-- Conta -->
  <g>
    <rect x="700" y="320" width="230" height="150" fill="#eaf2fb" stroke="#2c5282" stroke-width="1.6"/>
    <line x1="700" y1="362" x2="930" y2="362" stroke="#2c5282" stroke-width="1.2"/>
    <line x1="700" y1="418" x2="930" y2="418" stroke="#2c5282" stroke-width="1.2"/>
    <text x="815" y="353" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">Conta</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="710" y="377">- agencia: string</text>
      <text x="710" y="392">- numero: string</text>
      <text x="710" y="407">- status: string</text>
    </g>
    <g font-size="10.5" fill="#1a202c">
      <text x="710" y="436">+ saldo(): numeric</text>
      <text x="710" y="451">+ extrato(periodo): array</text>
    </g>
    <text x="815" y="466" text-anchor="middle" font-size="9" font-style="italic" fill="#b7791f">sem coluna de saldo (RN02)</text>
  </g>

  <!-- LogAuditoria -->
  <g>
    <rect x="40" y="470" width="260" height="150" fill="#fdf3e0" stroke="#b7791f" stroke-width="1.6"/>
    <line x1="40" y1="512" x2="300" y2="512" stroke="#b7791f" stroke-width="1.2"/>
    <line x1="40" y1="578" x2="300" y2="578" stroke="#b7791f" stroke-width="1.2"/>
    <text x="170" y="486" text-anchor="middle" font-size="10" font-style="italic" fill="#8a5a10">«append-only»</text>
    <text x="170" y="503" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a202c">LogAuditoria</text>
    <g font-size="10.5" fill="#1a202c">
      <text x="50" y="527">- evento: string</text>
      <text x="50" y="542">- estadoAnterior: jsonb</text>
      <text x="50" y="557">- estadoNovo: jsonb</text>
      <text x="50" y="572">- hashAnterior: string</text>
    </g>
    <text x="50" y="596" font-size="10.5" fill="#1a202c">+ registrar(evento, antes, depois)</text>
  </g>

  <!-- Composition Transacao -> Lancamento -->
  <line x1="475" y1="210" x2="475" y2="308" stroke="#2c5282" stroke-width="1.6"/>
  <path d="M475,210 l8,10 l-8,10 l-8,-10 Z" fill="#2c5282"/>
  <text x="490" y="225" font-size="10" fill="#1a202c">1</text>
  <text x="490" y="305" font-size="10" fill="#1a202c">2..*</text>

  <!-- Association Lancamento -> Conta -->
  <line x1="620" y1="390" x2="700" y2="390" stroke="#2c5282" stroke-width="1.4"/>
  <text x="630" y="383" font-size="10" fill="#1a202c">0..*</text>
  <text x="675" y="383" font-size="10" fill="#1a202c">1</text>

  <!-- Dependency Transacao -> LogAuditoria -->
  <path d="M330,160 C120,220 100,300 170,470" fill="none" stroke="#4a5568" stroke-width="1.2" stroke-dasharray="6,4" marker-end="url(#openArrowCls)"/>
  <text x="140" y="330" font-size="10" font-style="italic" fill="#4a5568">«use»</text>

  <!-- Invariant note -->
  <rect x="640" y="70" width="290" height="110" fill="#f7fafc" stroke="#a0aec0" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="655" y="90" font-size="10.5" font-weight="bold" fill="#1a202c">Invariante (RN02 / RN03)</text>
  <text x="655" y="110" font-size="10" fill="#1a202c">SUM(Lancamento.valor) de uma</text>
  <text x="655" y="124" font-size="10" fill="#1a202c">mesma Transacao é sempre zero.</text>
  <text x="655" y="145" font-size="10" fill="#1a202c">O saldo de Conta é sempre</text>
  <text x="655" y="159" font-size="10" fill="#1a202c">derivado — nunca gravado</text>
  <text x="655" y="173" font-size="10" fill="#1a202c">ou editado diretamente.</text>
</svg>
