<text x="162.0" y="112.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">Perda de tempo e deslocamento</text>
<line x1="42.0" y1="128.0" x2="282.0" y2="128.0" stroke="#b45309" stroke-width="0.9"/>
<text x="42.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Cliente depende de horario</text>
<text x="42.0" y="158.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">comercial e de agencia.</text>
<path d="M 337.5 300.0 L 337.5 244.0 L 162.0 244.0 L 162.0 188.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
