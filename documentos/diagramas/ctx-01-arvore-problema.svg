<text x="454.0" y="112.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">Custo elevado por tarifa</text>
<line x1="334.0" y1="128.0" x2="574.0" y2="128.0" stroke="#b45309" stroke-width="0.9"/>
<text x="334.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Cada operacao paga valor</text>
<text x="334.0" y="158.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">dificil de prever.</text>
<path d="M 512.5 300.0 L 512.5 244.0 L 454.0 244.0 L 454.0 188.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<rect x="614.0" y="92.0" width="264.0" height="96.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="746.0" y="112.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">Risco de fraude e erro</text>
<line x1="626.0" y1="128.0" x2="866.0" y2="128.0" stroke="#b45309" stroke-width="0.9"/>
<text x="626.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Sem 2FA, sem limites por periodo</text>
<text x="626.0" y="158.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">e sem trilha confiavel.</text>
<path d="M 687.5 300.0 L 687.5 244.0 L 746.0 244.0 L 746.0 188.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<rect x="906.0" y="92.0" width="264.0" height="96.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="1038.0" y="112.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">Baixo valor pedagogico</text>
<line x1="918.0" y1="128.0" x2="1158.0" y2="128.0" stroke="#b45309" stroke-width="0.9"/>
<text x="918.0" y="144.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">O aluno nao exercita o ciclo</text>
<text x="918.0" y="158.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">completo de engenharia</text>
<text x="918.0" y="173.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">de software.</text>
<path d="M 862.5 300.0 L 862.5 244.0 L 1038.0 244.0 L 1038.0 188.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<text x="30.0" y="80.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c4a03">CONSEQUENCIAS (efeitos do problema)</text>
<rect x="250.0" y="300.0" width="700.0" height="104.0" rx="7" fill="#fdeceb" stroke="#b45309" stroke-width="2.2"/>
<text x="600.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13.2" font-weight="700" text-anchor="middle" fill="#7c4a03">PROBLEMA CENTRAL</text>
<line x1="262.0" y1="336.0" x2="938.0" y2="336.0" stroke="#b45309" stroke-width="0.9"/>
<text x="262.0" y="352.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">O usuario nao dispoe de uma plataforma bancaria digital unica,</text>
<text x="262.0" y="366.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">transparente e segura, acessivel pela web e pelo celular, que</text>
<text x="262.0" y="381.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">concentre conta, movimentacoes, cartoes e pagamentos com</text>
<text x="262.0" y="395.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">rastreabilidade total de cada operacao.</text>
<rect x="30.0" y="560.0" width="264.0" height="116.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="162.0" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">1. Burocracia e lentidao</text>
<line x1="42.0" y1="596.0" x2="282.0" y2="596.0" stroke="#b45309" stroke-width="0.9"/>
<text x="42.0" y="612.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Abertura de conta em agencia,</text>
<text x="42.0" y="626.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">analise manual e espera de dias.</text>
<path d="M 162.0 560.0 L 162.0 482.0 L 600.0 482.0 L 600.0 404.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<rect x="322.0" y="560.0" width="264.0" height="116.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="454.0" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">2. Custo e opacidade</text>
<line x1="334.0" y1="596.0" x2="574.0" y2="596.0" stroke="#b45309" stroke-width="0.9"/>
<text x="334.0" y="612.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Tarifas pouco claras e extrato</text>
<text x="334.0" y="626.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">de dificil leitura.</text>
<path d="M 454.0 560.0 L 454.0 482.0 L 600.0 482.0 L 600.0 404.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<rect x="614.0" y="560.0" width="264.0" height="116.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="746.0" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">3. Baixo controle do cliente</text>
<line x1="626.0" y1="596.0" x2="866.0" y2="596.0" stroke="#b45309" stroke-width="0.9"/>
<text x="626.0" y="612.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Limites, cartoes e seguranca</text>
<text x="626.0" y="626.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">sem gestao pelo proprio usuario.</text>
<path d="M 746.0 560.0 L 746.0 482.0 L 600.0 482.0 L 600.0 404.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<rect x="906.0" y="560.0" width="264.0" height="116.0" rx="7" fill="#fff8e6" stroke="#b45309" stroke-width="1.5"/>
<text x="1038.0" y="580.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.4" font-weight="700" text-anchor="middle" fill="#7c4a03">4. Fragilidade de rastreio</text>
<line x1="918.0" y1="596.0" x2="1158.0" y2="596.0" stroke="#b45309" stroke-width="0.9"/>
<text x="918.0" y="612.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">Sistemas academicos sem trilha de</text>
<text x="918.0" y="626.5" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">auditoria, partidas dobradas</text>
<text x="918.0" y="641.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.2" font-weight="500" text-anchor="start" fill="#1b2430">e historico imutavel.</text>
<path d="M 1038.0 560.0 L 1038.0 482.0 L 600.0 482.0 L 600.0 404.0" fill="none" stroke="#b45309" stroke-width="1.5" stroke-dasharray="" marker-end="url(#arrow-ink)"/>
<text x="30.0" y="548.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" text-anchor="start" fill="#7c4a03">CAUSAS (origem do problema)</text>
<text x="600.0" y="726.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle" fill="#5a6b7b">Leitura: as causas (base) produzem o problema central, que gera as consequencias (topo).</text>

</svg>